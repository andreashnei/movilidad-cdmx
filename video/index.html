<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Interactivo</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="video-app" aria-labelledby="dynamicTitle">
        <section class="player-shell">
            <header class="timeline-copy" aria-live="polite">
                <p id="playlistLabel" class="playlist-label">Video 1 de 5</p>
                <h1 id="dynamicTitle">Video interactivo</h1>
                <p id="dynamicText"></p>
            </header>

            <div class="video-frame">
                <video id="interactiveVideo" controls playsinline preload="metadata"></video>
            </div>

            <div class="player-controls" aria-label="Controles del video">
                <button type="button" data-action="previous-video">Video anterior</button>
                <button type="button" id="playPauseButton" data-action="toggle-play">Reproducir</button>
                <button type="button" data-action="next-video">Siguiente video</button>
            </div>

            <fieldset class="timeline-fieldset">
                <legend>Linea de tiempo</legend>
                <label for="timelineRange" class="timeline-label">
                    <span>Año activo</span>
                    <strong id="activeYear">1969</strong>
                </label>
                <input id="timelineRange" type="range" min="0" max="6" step="1" value="0" list="timelineMarkers">
                <datalist id="timelineMarkers"></datalist>
                <p id="activeKeyframeText" class="active-keyframe-text"></p>
                <ol id="keyframeList" class="keyframe-list" aria-label="Cortes del video"></ol>
            </fieldset>
        </section>

        <aside class="playlist-panel" aria-label="Playlist de videos">
            <h2>Playlist</h2>
            <div id="playlistButtons" class="playlist-buttons"></div>
        </aside>
    </main>

    <script src="./script.js"></script>
</body>
</html>
